# Stages for the supply-chain demo. Names say what to expect:
#   green = promotion should succeed, red = promotion should be blocked.
#
# trivy-image (custom step)
#   trivy-image-pass       alpine 3.24.2         -> no fixable CRITICAL vulnerabilities, passes
#   trivy-image-blocked    nginx 1.20.0          -> CRITICAL vulnerabilities, blocked (listed in the output)
# cosign-verify (custom step)
#   cosign-verify-pass     cosign v3.1.3         -> signed by the Sigstore project, passes
#   cosign-verify-blocked  node-exporter v1.9.1  -> not signed with cosign, blocked
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: trivy-image-pass
  namespace: custom-steps-supply-chain
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: images
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: trivy-image
        vars:
        - name: imageRepo
          value: mirror.gcr.io/library/alpine
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: trivy-image-blocked
  namespace: custom-steps-supply-chain
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: images
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: trivy-image
        vars:
        - name: imageRepo
          value: mirror.gcr.io/library/nginx
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cosign-verify-pass
  namespace: custom-steps-supply-chain
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: images
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: cosign-verify
        vars:
        - name: imageRepo
          value: ghcr.io/sigstore/cosign/cosign
        - name: identity
          value: keyless@projectsigstore.iam.gserviceaccount.com
        - name: issuer
          value: https://accounts.google.com
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cosign-verify-blocked
  namespace: custom-steps-supply-chain
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: images
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: cosign-verify
        vars:
        - name: imageRepo
          value: quay.io/prometheus/node-exporter
        - name: identity
          value: keyless@projectsigstore.iam.gserviceaccount.com
        - name: issuer
          value: https://accounts.google.com
