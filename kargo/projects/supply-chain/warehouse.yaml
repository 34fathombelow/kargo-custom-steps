# Every image the supply-chain demo inspects, each pinned to one tag so the
# outcomes are reproducible:
#   alpine 3.24.2   - current; no fixable CRITICAL vulnerabilities  -> trivy-image-pass
#   nginx 1.20.0    - from 2021; many CRITICAL vulnerabilities      -> trivy-image-blocked
#   cosign v3.1.3   - keyless-signed by the Sigstore project       -> cosign-verify-pass
#   node-exporter v1.9.1 - not signed with cosign                  -> cosign-verify-blocked
#     (from quay.io directly: checking a mirror.gcr.io image for a signature
#     makes the mirror query Docker Hub, which hits its quota)
# Docker Hub images come from Google's mirror (mirror.gcr.io) to avoid anonymous pull limits.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: images
  namespace: custom-steps-supply-chain
  labels:
    kargo.akuity.io/shard: custom-steps
spec:
  shard: custom-steps
  interval: 5m0s
  subscriptions:
  - image:
      repoURL: mirror.gcr.io/library/alpine
      imageSelectionStrategy: SemVer
      constraint: "3.24.2"
      discoveryLimit: 1
  - image:
      repoURL: mirror.gcr.io/library/nginx
      imageSelectionStrategy: SemVer
      constraint: "1.20.0"
      discoveryLimit: 1
  - image:
      repoURL: ghcr.io/sigstore/cosign/cosign
      imageSelectionStrategy: SemVer
      constraint: "3.1.3"
      discoveryLimit: 1
  - image:
      repoURL: quay.io/prometheus/node-exporter
      imageSelectionStrategy: SemVer
      constraint: "1.9.1"
      discoveryLimit: 1
