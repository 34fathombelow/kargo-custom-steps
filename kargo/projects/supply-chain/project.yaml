# Demo project for the "supply-chain" group: is this image safe and trusted?
# Kargo's Project webhook creates the custom-steps-supply-chain namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-supply-chain
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
