# Scans one image from the Freight with the trivy-image custom step.
#
# The image is pinned by digest (imageFrom().Digest), so the scan covers exactly
# the bytes Kargo discovered, even if someone re-pushes the tag later.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: trivy-image
  namespace: custom-steps-supply-chain
spec:
  vars:
  - name: imageRepo
  - name: severity
    value: CRITICAL
  steps:
  - uses: trivy-image
    as: scan
    config:
      image: ${{ imageFrom(vars.imageRepo).RepoURL + "@" + imageFrom(vars.imageRepo).Digest }}
      severity: ${{ vars.severity }}
