# Stages for the policy demo. Names say what to expect:
#   green = promotion should succeed, red = promotion should be blocked.
#
# kyverno-apply (custom step)       kyverno-apply-pass / kyverno-apply-blocked
# opa-conftest (custom step)        opa-conftest-pass / opa-conftest-blocked
# opa-promotion-gate (custom step)  opa-promotion-gate-allowed (environment dev)
#                                   opa-promotion-gate-denied (environment prod,
#                                   no change ticket, actor not a release manager)
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: kyverno-apply-pass
  namespace: custom-steps-policy
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: kyverno-apply
        vars:
        - name: manifests
          value: compliant
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: kyverno-apply-blocked
  namespace: custom-steps-policy
