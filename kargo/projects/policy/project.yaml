# Demo project for the "policy" group: policy-as-code gates with Kyverno and OPA.
# The Namespace is created first and adopted by the Project (it carries the
# kargo.akuity.io/project label), so everything applies in one go.
apiVersion: v1
kind: Namespace
metadata:
  name: custom-steps-policy
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-policy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
