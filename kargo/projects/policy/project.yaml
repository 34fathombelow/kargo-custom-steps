# Demo project for the "policy" group: policy-as-code gates with Kyverno and OPA.
# Kargo's Project webhook creates the custom-steps-policy namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-policy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
