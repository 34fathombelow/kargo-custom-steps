# Demo project for the "data" group: move the database with the release.
# Kargo's Project webhook creates the custom-steps-data namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
