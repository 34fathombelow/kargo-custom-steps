# Demo project for the "manifest-quality" group: will these manifests work on the
# Kargo's Project webhook creates the custom-steps-manifest-quality namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-manifest-quality
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
