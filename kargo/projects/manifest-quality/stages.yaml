# Stages for the manifest-quality demo. Names say what to expect:
#   green = promotion should succeed, red = promotion should be blocked.
#
# deprecated-apis (custom step), same manifests, different target clusters:
#   k8s-1-25   the v2beta2 HPA is deprecated but still served  -> passes
#   k8s-1-33   the v2beta2 HPA was removed in 1.26             -> blocked
#
# cluster-version + deprecated-apis, version looked up from the live cluster:
#   cluster-version-live   asks the agent cluster for its version, then checks
#                          the same manifests against it. Every supported
#                          Kubernetes version is newer than 1.25, so this is
#                          blocked, and its output shows the cluster's version.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: k8s-1-25
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deprecated-apis
        vars:
        - name: k8sVersion
          value: "1.25"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: k8s-1-33
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deprecated-apis
        vars:
        - name: k8sVersion
          value: "1.33"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cluster-version-live
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
    # Experiment: run the promotion pod as the agent namespace's `default`
    # service account. The cluster-version step reports whether that account's
    # token was mounted into the step container (output podServiceAccountToken)
    # and uses it if so.
    ee.kargo.akuity.io/promotion-sa: default
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: cluster-version
