# Stages for the manifest-quality demo. Names say what to expect:
#   green = promotion should succeed, red = promotion should be blocked.
#
# cluster-version looks up the agent cluster's Kubernetes version from Argo CD;
# deprecated-apis then checks manifests against it:
#   cluster-version-lookup   only looks up the version; the step output shows it  -> passes
#   cluster-version-pass     current manifests                                    -> passes
#   cluster-version-blocked  an autoscaling/v2beta2 HPA (removed in 1.26, older
#                            than any supported cluster)                          -> blocked
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cluster-version-lookup
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: cluster-version
        as: cluster
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cluster-version-pass
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deprecated-apis
        vars:
        - name: manifests
          value: clean
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cluster-version-blocked
  namespace: custom-steps-manifest-quality
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deprecated-apis
        vars:
        - name: manifests
          value: manifests
