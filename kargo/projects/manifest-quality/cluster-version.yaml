# Looks up the target cluster's Kubernetes version with the cluster-version
# custom step, then checks the manifests against it with deprecated-apis, so
# nobody has to keep a version number in the Stage up to date.
#
# The version comes from the Argo CD agent that runs next to the Kargo agent
# (same namespace, on the custom-steps agent cluster), which reports the one
# cluster it manages, so the step needs no config here.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: cluster-version
  namespace: custom-steps-manifest-quality
spec:
  vars:
  - name: repoURL
    value: https://github.com/34fathombelow/kargo-custom-steps.git
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: main
        path: ./src
  - uses: cluster-version
    as: cluster
  - uses: deprecated-apis
    as: apis
    config:
      path: ./src/demo-fixtures/deprecated-apis/manifests
      # `version` is vX.Y.Z (e.g. v1.33.4), which the template engine keeps as a string.
      k8sVersion: ${{ task.outputs['cluster'].version }}
