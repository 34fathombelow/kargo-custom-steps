# Demo project for the "rendering" group: render with tools Kargo doesn't ship.
# Kargo's Project webhook creates the custom-steps-rendering namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-rendering
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
