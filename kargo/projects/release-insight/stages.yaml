# Stages for the release-insight demo. green = should succeed, red = should be blocked.
#
# manifest-diff-changes       renders the chart for the current and the new image
#                             tag and shows the diff
# release-diff-dev            git log between the commit dev last ran and the
#                             promoted commit
#   -> release-diff-staging   the same for staging, fed from release-diff-dev
#                             (Freight carries over)
# argocd-drift-check-pass     Argo CD app that is Synced + Healthy          -> passes
# argocd-drift-check-blocked  Argo CD app that was never synced (OutOfSync) -> blocked
#                             (both need prereqs/argocd-drift-check)
# sentry-release-pass         records release guestbook@<tag> and a deploy to
#                             this Stage in Sentry                          -> passes
# sentry-release-blocked      the same with a Sentry project that doesn't exist -> fails
#                             (both need the `sentry` secret, see secrets/README.md)
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: manifest-diff-changes
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: manifest-diff
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release-diff-dev
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook-source
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: release-diff
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release-diff-staging
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook-source
    sources:
      stages:
      - release-diff-dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: release-diff
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: argocd-drift-check-pass
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: argocd-drift-check
        vars:
        - name: app
          value: drift-demo-clean
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: argocd-drift-check-blocked
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: argocd-drift-check
        vars:
        - name: app
          value: drift-demo-unsynced
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: sentry-release-pass
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: sentry-release
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: sentry-release-blocked
  namespace: custom-steps-release-insight
  labels:
    kargo.akuity.io/shard: custom-steps
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: custom-steps
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: sentry-release
        vars:
        - name: project
          value: does-not-exist
