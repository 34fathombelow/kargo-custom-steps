# Demo project for the "release-insight" group: what exactly is changing?
# Kargo's Project webhook creates the custom-steps-release-insight namespace when the Project
# is admitted; sync-wave -1 makes that happen before Argo CD applies
# anything into it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-release-insight
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
