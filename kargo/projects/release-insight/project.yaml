# Demo project for the "release-insight" group: what exactly is changing?
# The Namespace is created first and adopted by the Project (it carries the
# kargo.akuity.io/project label), so everything applies in one go.
apiVersion: v1
kind: Namespace
metadata:
  name: custom-steps-release-insight
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: custom-steps-release-insight
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
