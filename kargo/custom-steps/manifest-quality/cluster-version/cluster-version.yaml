# CustomPromotionStep: cluster-version
#
# Looks up the Kubernetes version of a cluster from its API server's /version
# endpoint, so later steps target what the cluster actually runs instead of a
# version someone has to keep updating by hand, e.g.
#   deprecated-apis:  k8sVersion: ${{ task.outputs['cluster'].version }}
#
# Credentials, for the default (the cluster the promotion runs on), in order:
#   1. the in-cluster token + CA that the access-argocd capability provides when
#      Argo CD runs in this cluster (any authenticated token may read /version);
#   2. anonymous: allowed by default on most clusters (system:public-info-viewer),
#      but not on k3s.
# For another cluster, set apiServer (and token if it disables anonymous /version).
#
# Config (all optional):
#   apiServer              API server URL; default: the cluster the promotion
#                          runs on (https://kubernetes.default.svc)
#   caCert                 PEM CA bundle to verify apiServer's certificate
#   insecureSkipTLSVerify  skip certificate verification when no CA is available
#                          (/version is public, but a spoofed answer would mislead the gates)
#   token                  bearer token, only for clusters that disable anonymous /version
#
# Output (JSON): version (vX.Y.Z), gitVersion (raw, e.g. v1.30.4-eks-a737599),
#   major, minor ("1.30": a string; prefer `version` in expressions), platform, source,
#   auth (argocd-capability | token | anonymous)
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: cluster-version
spec:
  image: ghcr.io/34fathombelow/toolbox:1.2.0
  # For the default (local) cluster: when Argo CD runs in the same cluster, Kargo
  # provisions an in-cluster token + CA, which is all /version needs.
  capabilities:
  - access-argocd
  defaultTimeout: 1m
  defaultErrorThreshold: 3
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  env:
  - name: CV_API_SERVER
    value: ${{ quote(config.apiServer ?? "") }}
  - name: CV_CA_CERT
    value: ${{ asJSON(config.caCert ?? "") }}
  - name: CV_INSECURE
    value: ${{ quote(string(config.insecureSkipTLSVerify ?? false)) }}
  - name: CV_TOKEN
    value: ${{ asJSON(config.token ?? "") }}
  command:
  - bash
  - -c
  - |
    set -euo pipefail
    out=/tmp/cluster-version.json
    # Secrets and free-form values arrive as JSON (asJSON) so newlines and quotes survive.
    CV_CA_CERT="$(jq -j . <<<"$CV_CA_CERT")"
    CV_TOKEN="$(jq -j . <<<"$CV_TOKEN")"
    fail() {
      jq -n --arg e "$*" --arg src "${server:-}" --arg ac "${argocd_provided:-}" '{version: "", source: $src, argocdCredentials: $ac, error: $e}' > "$out"
      echo "cluster-version: $*" >&2; exit 1
    }
    trap 'echo "cluster-version: unexpected error on line $LINENO" >&2' ERR

    server="$CV_API_SERVER"
    auth=anonymous
    # What the access-argocd capability provided (names only, never contents), so a
    # failed lookup can say why: token = in-cluster Argo CD (usable here),
    # kubeconfig = remote Argo CD (another cluster), none = nothing provisioned.
    argocd_creds="${STEP_DIRECTORY:-/coordination}/kubernetes/argocd"
    if [ -f "$argocd_creds/token" ] && [ -f "$argocd_creds/ca.crt" ]; then argocd_provided=token
    elif [ -f "$argocd_creds/kubeconfig" ]; then argocd_provided=kubeconfig
    else argocd_provided=none; fi
    curl_args=(--silent --show-error --max-time 15 --output /tmp/version.json --write-out '%{http_code}')
    if [ -z "$server" ]; then
      # The cluster the promotion pod runs on.
      server="https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"
      # access-argocd provisions token + ca.crt only for an in-cluster Argo CD, i.e.
      # credentials for this very cluster. (A kubeconfig means a remote Argo CD:
      # the wrong cluster, so it is ignored.)
      if [ -z "$CV_TOKEN" ] && [ "$argocd_provided" = token ]; then
        CV_TOKEN="$(cat "$argocd_creds/token")"
        [ -n "$CV_CA_CERT" ] || CV_CA_CERT="$(cat "$argocd_creds/ca.crt")"
        auth=argocd-capability
      fi
      if [ -z "$CV_CA_CERT" ] && [ "$CV_INSECURE" != "true" ]; then
        fail "no CA to verify the in-cluster API server: Kargo provides one through the access-argocd capability when Argo CD runs in this cluster; otherwise set config.caCert, or config.insecureSkipTLSVerify: true"
      fi
    fi
    if [ -n "$CV_TOKEN" ] && [ "$auth" = anonymous ]; then auth=token; fi
    case "$server" in
      http://*|https://*) ;;
      *) fail "config.apiServer must be an http(s) URL, got: $server" ;;
    esac
    if [ -n "$CV_CA_CERT" ]; then
      printf '%s\n' "$CV_CA_CERT" > /tmp/cluster-ca.crt
      curl_args+=(--cacert /tmp/cluster-ca.crt)
    fi
    # Skip verification only when there is no CA to verify with.
    if [ "$CV_INSECURE" = "true" ] && [ -z "$CV_CA_CERT" ]; then curl_args+=(--insecure); fi
    if [ -n "$CV_TOKEN" ]; then
      # Header file: the token never appears in argv.
      (umask 077; printf 'Authorization: Bearer %s\n' "$CV_TOKEN" > /tmp/auth.header)
      curl_args+=(--header @/tmp/auth.header)
    fi

    code="$(curl "${curl_args[@]}" "${server%/}/version" 2>/tmp/curl.err)" || code="000"
    rm -f /tmp/auth.header
    case "$code" in
      200) ;;
      401|403)
        case "$auth" in
          argocd-capability) fail "$server rejected the in-cluster token from the access-argocd capability (HTTP $code)" ;;
          token) fail "$server rejected the token (HTTP $code)" ;;
        esac
        case "$argocd_provided" in
          kubeconfig) why="the access-argocd capability provided a kubeconfig, so this agent's Argo CD is remote (another cluster) and Kargo gives no token for this one" ;;
          none) why="the access-argocd capability provided no credentials (is Kargo's Argo CD integration enabled for this agent?)" ;;
          *) why="no token was available" ;;
        esac
        fail "$server does not allow anonymous access to /version (HTTP $code): $why. Set config.token, or allow anonymous /version on the cluster" ;;
      000) fail "cannot reach $server: $(tail -1 /tmp/curl.err) (is it reachable from the cluster where promotion pods run?)" ;;
      *) fail "$server returned HTTP $code for /version" ;;
    esac

    git_version="$(jq -r '.gitVersion // empty' /tmp/version.json 2>/dev/null || true)"
    [ -n "$git_version" ] || fail "$server/version did not return a gitVersion (is it a Kubernetes API server?)"
    # vX.Y.Z without vendor suffixes (v1.30.4-eks-a737599 -> v1.30.4), the form pluto and helm expect.
    version="$(sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/v\1.\2.\3/p' <<<"$git_version")"
    [ -n "$version" ] || fail "unrecognized gitVersion: $git_version"

    jq --arg v "$version" --arg src "$server" --arg auth "$auth" --arg ac "$argocd_provided" '{
        version: $v,
        gitVersion: .gitVersion,
        major: (.major // ""),
        minor: ($v | ltrimstr("v") | split(".")[:2] | join(".")),
        platform: (.platform // ""),
        source: $src,
        auth: $auth,
        argocdCredentials: $ac
      }' /tmp/version.json > "$out"
    echo "Cluster at $server runs Kubernetes $git_version ($version); authenticated: $auth."
  output:
    source:
      type: File
      path: /tmp/cluster-version.json
