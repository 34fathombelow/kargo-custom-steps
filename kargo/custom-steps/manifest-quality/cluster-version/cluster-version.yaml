# CustomPromotionStep: cluster-version
#
# Looks up the Kubernetes version of a cluster from Argo CD, so later steps
# target what the cluster actually runs instead of a version someone has to
# keep updating by hand, e.g.
#   deprecated-apis:  k8sVersion: ${{ task.outputs['cluster'].version }}
#
# Argo CD's application controller publishes every cluster it manages as a
# Prometheus metric, unauthenticated:
#   argocd_cluster_info{k8s_version="v1.35.5",name="custom-steps-agent",server="..."} 1
# The step reads it from the argocd-metrics Service. By default it uses the short
# name, which resolves in the promotion pod's own namespace, so it REQUIRES the
# Argo CD agent to run in the same namespace (and cluster) as the Kargo agent's
# promotion controller. No capability, token or CA is needed.
#
# Config (all optional):
#   cluster     Argo CD cluster name to report; default: the only cluster in the
#               metrics (each Akuity Argo CD agent reports just its own)
#   metricsURL  default http://argocd-metrics:8082/metrics
#
# Output (JSON): version (vX.Y.Z), k8sVersion (raw, as Argo CD reports it),
#   minor ("1.35": a string; prefer `version` in expressions), cluster, server,
#   source (the metrics URL)
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: cluster-version
spec:
  image: ghcr.io/34fathombelow/toolbox:1.2.0
  defaultTimeout: 1m
  defaultErrorThreshold: 3
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  env:
  - name: CV_CLUSTER
    value: ${{ asJSON(config.cluster ?? "") }}
  - name: CV_METRICS_URL
    value: ${{ asJSON(config.metricsURL ?? "") }}
  command:
  - bash
  - -c
  - |
    set -euo pipefail
    out=/tmp/cluster-version.json
    # Free-form values arrive as JSON (asJSON) so quotes and digit-only names survive.
    CV_CLUSTER="$(jq -j . <<<"$CV_CLUSTER")"
    CV_METRICS_URL="$(jq -j . <<<"$CV_METRICS_URL")"
    url="${CV_METRICS_URL:-http://argocd-metrics:8082/metrics}"
    fail() {
      jq -n --arg e "$*" --arg src "$url" --arg c "$CV_CLUSTER" '{version: "", cluster: $c, source: $src, error: $e}' > "$out"
      echo "cluster-version: $*" >&2; exit 1
    }
    trap 'echo "cluster-version: unexpected error on line $LINENO" >&2' ERR
    case "$url" in
      http://*|https://*) ;;
      *) fail "config.metricsURL must be an http(s) URL, got: $url" ;;
    esac

    # A promotion pod's first connections can be refused for a moment while the
    # cluster's network policy catches up with the new pod, so retry "connection
    # refused" (curl exit 7) briefly. Anything else fails right away.
    for _ in $(seq 1 15); do
      rc=0
      code="$(curl --silent --show-error --max-time 10 --output /tmp/metrics.txt --write-out '%{http_code}' "$url" 2>/tmp/curl.err)" || rc=$?
      [ "$rc" = 0 ] || code=000
      [ "$rc" = 7 ] || break
      sleep 2
    done
    case "$code" in
      200) ;;
      000) fail "cannot reach Argo CD metrics at $url: $(tail -1 /tmp/curl.err) (the Argo CD agent must run in the same namespace as the Kargo agent's promotion controller; otherwise set config.metricsURL)" ;;
      *) fail "$url returned HTTP $code (is it Argo CD's application-controller metrics endpoint?)" ;;
    esac

    # argocd_cluster_info{k8s_version="v1.35.5",name="x",server="y"} 1  ->  one JSON object per line.
    # Labels are matched by name, so their order doesn't matter.
    { grep -E '^argocd_cluster_info\{' /tmp/metrics.txt || true; } | sed -E 's/^argocd_cluster_info\{(.*)\}.*$/\1/' |
      jq -R -c '[scan("([a-zA-Z0-9_]+)=\"((?:[^\"\\\\]|\\\\.)*)\"") | {key: .[0], value: .[1]}] | from_entries
                 | {name: (.name // ""), server: (.server // ""), k8sVersion: (.k8s_version // "")}' > /tmp/clusters.jsonl
    names="$(jq -r .name /tmp/clusters.jsonl | paste -sd, - | sed 's/,/, /g')"
    count="$(wc -l < /tmp/clusters.jsonl | tr -d ' ')"
    [ "$count" -gt 0 ] || fail "$url has no argocd_cluster_info metric (is it Argo CD's application-controller metrics endpoint, and does Argo CD manage a cluster?)"
    if [ -n "$CV_CLUSTER" ]; then
      jq -c --arg c "$CV_CLUSTER" 'select(.name == $c)' /tmp/clusters.jsonl | head -1 > /tmp/cluster.json || true
      [ -s /tmp/cluster.json ] || fail "Argo CD reports no cluster named \"$CV_CLUSTER\" (it reports: $names)"
    elif [ "$count" -eq 1 ]; then
      cp /tmp/clusters.jsonl /tmp/cluster.json
    else
      fail "Argo CD reports $count clusters ($names): set config.cluster to pick one"
    fi

    raw="$(jq -r .k8sVersion /tmp/cluster.json)"
    name="$(jq -r .name /tmp/cluster.json)"
    [ -n "$raw" ] || fail "Argo CD has not reported a Kubernetes version for cluster \"$name\" yet (is the cluster connected?)"
    # vX.Y.Z without vendor suffixes (v1.34.2+k3s1 -> v1.34.2), the form pluto and helm expect.
    # Some Argo CD versions report only X.Y; then the patch is 0.
    version="$(sed -nE 's/^v?([0-9]+)\.([0-9]+)(\.([0-9]+))?.*/v\1.\2.\4/p' <<<"$raw" | sed -E 's/\.$/.0/')"
    [ -n "$version" ] || fail "unrecognized Kubernetes version for cluster \"$name\": $raw"

    jq --arg v "$version" --arg src "$url" '{
        version: $v,
        k8sVersion: .k8sVersion,
        minor: ($v | ltrimstr("v") | split(".")[:2] | join(".")),
        cluster: .name,
        server: .server,
        source: $src
      }' /tmp/cluster.json > "$out"
    echo "Argo CD reports cluster \"$name\" runs Kubernetes $raw ($version)."
  output:
    source:
      type: File
      path: /tmp/cluster-version.json
