# CustomPromotionStep: sbom-generate
#
# Writes an SBOM (software bill of materials: every package in the image, with
# its version and license) for an image being promoted, with Syft, into the
# promotion workdir next to the rendered manifests. Later steps can commit,
# upload or scan the file. Optional deny rules block the promotion when the image
# contains a package the team doesn't ship, e.g. an end-of-life OpenSSL. The SBOM
# is written either way.
#
# Config:
#   image     - image to describe, ideally by digest (repo@sha256:...) (required)
#   outPath   - workdir-relative file to write, e.g. ./out/sbom/app.spdx.json (required)
#   format    - spdx-json (default), cyclonedx-json or syft-json
#   platform  - platform of a multi-arch image to describe (default linux/amd64)
#   deny      - list of rules {name, version, license, reason}: name, version and
#               license are regular expressions; a package matching every field a
#               rule sets is denied, and any denied package blocks the promotion
#
# Output (JSON): passed, image, digest, format, path, packages, byType, licenses,
#   denied[{name, version, type, licenses, reason}], deniedCount, truncated, error
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: sbom-generate
spec:
  image: ghcr.io/34fathombelow/syft:1.55.0
  defaultTimeout: 5m
  defaultErrorThreshold: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  env:
  - name: SB_IMAGE
    value: ${{ quote(config.image ?? "") }}
  - name: SB_OUT_PATH
    value: ${{ quote(config.outPath ?? "") }}
  - name: SB_FORMAT
    value: ${{ quote(config.format ?? "spdx-json") }}
  - name: SB_PLATFORM
    value: ${{ quote(config.platform ?? "linux/amd64") }}
  - name: SB_DENY
    value: ${{ asJSON(config.deny ?? []) }}
  command:
  - bash
  - -c
  - |
    set -euo pipefail
    trap 'echo "sbom-generate: unexpected error on line $LINENO" >&2' ERR
    out=/tmp/sbom-generate.json
    fail() {
      echo "sbom-generate: $*" >&2
      jq -n --arg image "$SB_IMAGE" --arg format "$SB_FORMAT" --arg error "$*" \
        '{passed: false, image: $image, digest: "", format: $format, path: "", packages: 0, byType: {},
          licenses: {}, denied: [], deniedCount: 0, truncated: false, error: $error}' > "$out"
      exit 1
    }

    [ -n "$SB_IMAGE" ] || fail "config.image is required (ideally by digest, e.g. from imageFrom(...).Digest)"
    [ -n "$SB_OUT_PATH" ] || fail "config.outPath is required (a file, e.g. ./out/sbom/app.spdx.json)"
    case "$SB_OUT_PATH" in
      /*|*/|.|..|../*|*/..|*/../*) fail "config.outPath must be a file inside the workdir, got $SB_OUT_PATH" ;;
    esac
    case "$SB_FORMAT" in
      spdx-json|cyclonedx-json|syft-json) ;;
      *) fail "config.format must be spdx-json, cyclonedx-json or syft-json, got $SB_FORMAT" ;;
    esac
    # asJSON() output ends with a newline; normalize to compact JSON.
    deny="$(jq -c 'if type == "array" then . else error end' <<<"$SB_DENY" 2>/dev/null)" \
      || fail "config.deny must be a list of rules {name, version, license, reason}"
    # Every rule sets at least one of name/version/license, and each is a valid regular expression.
    bad="$(jq -r '
      to_entries[] | .key as $i | .value
      | if type != "object" or ([.name, .version, .license] | map(select(. != null and . != "")) | length) == 0
        then "rule \($i + 1) needs at least one of name, version or license"
        else (to_entries[] | select(.key == "name" or .key == "version" or .key == "license")
              | select((.value | type) != "string" or (.value as $re | try ("" | test($re)) catch "invalid") == "invalid")
              | "rule \($i + 1): \(.key) is not a valid regular expression: \(.value)")
        end' <<<"$deny" | head -1 || true)"
    [ -z "$bad" ] || fail "config.deny $bad"

    mkdir -p "$(dirname "$SB_OUT_PATH")"
    rm -f "$SB_OUT_PATH"
    # registry: pulls the image directly, so no Docker daemon is needed. One run
    # writes both the requested format and the syft-json summarized below.
    if ! syft "registry:$SB_IMAGE" --platform "$SB_PLATFORM" \
         -o "syft-json=/tmp/sbom.syft.json" -o "$SB_FORMAT=$SB_OUT_PATH" 2>/tmp/syft.log; then
      cat /tmp/syft.log >&2
      # The registry's own answer (e.g. MANIFEST_UNKNOWN, UNAUTHORIZED), else Syft's last line.
      reason="$(grep -m1 'oci-registry:' /tmp/syft.log | sed 's/^[[:space:]]*- oci-registry: //' || true)"
      [ -n "$reason" ] || reason="$(grep -v '^[[:space:]]*$' /tmp/syft.log | tail -1 || true)"
      fail "could not generate an SBOM for $SB_IMAGE: ${reason:-see the log above} (check the image name, tag or digest and that the promotion pod can reach its registry; private registries are not supported)"
    fi
    [ -s "$SB_OUT_PATH" ] || fail "syft wrote no SBOM to $SB_OUT_PATH"

    # Summary and deny checks. Only the first 50 denied packages are listed;
    # the step output is capped at 256 KiB, and the full SBOM is in the file.
    jq --argjson deny "$deny" --arg image "$SB_IMAGE" --arg format "$SB_FORMAT" --arg path "${SB_OUT_PATH#./}" '
      def matches($rule):
        ([.licenses[]?.value] | join(" ")) as $lic
        | (($rule.name // "") == "" or (.name | test($rule.name)))
          and (($rule.version // "") == "" or (.version | test($rule.version)))
          and (($rule.license // "") == "" or ($lic | test($rule.license)));
      [.artifacts[] | . as $p | ($deny | map(select(. as $r | $p | matches($r)))) as $hits
        | select($hits | length > 0)
        | {name, version, type, licenses: [.licenses[]?.value], reason: ($hits[0].reason // "denied by config.deny")}] as $denied
      | {passed: ($denied | length == 0),
         image: $image,
         digest: (.source.metadata.manifestDigest // ""),
         format: $format,
         path: $path,
         packages: (.artifacts | length),
         byType: ([.artifacts[].type] | group_by(.) | map({(.[0]): length}) | add // {}),
         licenses: ([.artifacts[].licenses[]?.value] | group_by(.) | map({key: .[0], value: length})
                    | sort_by(-.value) | .[:10] | from_entries),
         denied: $denied[:50],
         deniedCount: ($denied | length),
         truncated: ($denied | length > 50),
         error: ""}' /tmp/sbom.syft.json > "$out" || fail "could not read the SBOM syft wrote"

    jq -r '"SBOM for \(.image): \(.packages) package(s) (\(.byType | to_entries | map("\(.value) \(.key)") | join(", "))), written to \(.path) (\(.format))"' "$out"
    if [ "$(jq -r .passed "$out")" != true ]; then
      jq -r '.denied[] | "  denied: \(.name) \(.version) (\(.type)): \(.reason)"' "$out" >&2
      echo "sbom-generate: $(jq -r .deniedCount "$out") package(s) match config.deny; the SBOM is in $SB_OUT_PATH" >&2
      jq --arg e "$(jq -r '"\(.deniedCount) package(s) match config.deny: \(.denied | map(.name) | unique | join(", "))"' "$out")" '.error = $e' "$out" > /tmp/o && mv /tmp/o "$out"
      exit 1
    fi
  output:
    source:
      type: File
      path: /tmp/sbom-generate.json
