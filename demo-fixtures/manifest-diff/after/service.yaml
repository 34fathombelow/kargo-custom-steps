apiVersion: v1
kind: Service
metadata:
  name: guestbook
  namespace: guestbook
spec:
  selector:
    app: guestbook
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guestbook
  namespace: guestbook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: guestbook
