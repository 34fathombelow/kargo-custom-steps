# Demo prerequisite for the data group: a single-replica Postgres on the agent
# cluster that serves the custom-steps shard (where promotion pods run), so the
# flyway-migrate step can reach it. Registered in Argo CD as cluster
# "custom-steps-agent" (scripts/fork.sh --agent-cluster changes the name).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-custom-steps-prereq-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/34fathombelow/kargo-custom-steps.git
    targetRevision: HEAD
    path: prereqs/flyway-migrate
  destination:
    name: custom-steps-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
