# Throwaway Postgres for the flyway-migrate demo, on the cluster the promotion
# pods run on (the custom-steps shard's agent cluster). Synced by
# argocd/apps/prereqs-flyway-migrate.yaml.
# NOT for production: no persistence (emptyDir) and a demo password.
apiVersion: v1
kind: Namespace
metadata:
  name: custom-steps-prereqs
---
apiVersion: v1
kind: Secret
metadata:
  name: guestbook-postgres
  namespace: custom-steps-prereqs
type: Opaque
stringData:
  POSTGRES_USER: guestbook
  POSTGRES_PASSWORD: guestbook-demo
  POSTGRES_DB: guestbook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-postgres
  namespace: custom-steps-prereqs
  labels:
    app.kubernetes.io/name: guestbook-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17.11-alpine
        envFrom:
        - secretRef:
            name: guestbook-postgres
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "guestbook", "-d", "guestbook"]
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guestbook-postgres
  namespace: custom-steps-prereqs
spec:
  selector:
    app.kubernetes.io/name: guestbook-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
