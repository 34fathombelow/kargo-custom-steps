description: a password with quotes, a backslash and digits reaches Flyway byte-for-byte
config:
  url: jdbc:postgresql://runstep-pg:5432/tricky
  username: tricky
  password: 'pa"ss\word 12345678'
  migrationsPath: ./src/demo-fixtures/flyway-migrate/migrations
files:
  src/demo-fixtures/flyway-migrate: demo-fixtures/flyway-migrate
docker: ["--network", "runstep-pg"]
expect:
  status: Succeeded
  output:
    migrationsApplied: 3
    schemaVersion: "3"
