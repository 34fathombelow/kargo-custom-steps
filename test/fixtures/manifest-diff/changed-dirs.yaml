description: directories are compared as resource sets; adds, removals and edits are counted
config:
  from: before
  to: after
files:
  before: demo-fixtures/manifest-diff/before
  after: demo-fixtures/manifest-diff/after
expect:
  status: Succeeded
  output:
    changed: true
    summary: {added: 1, removed: 1, modified: 1, unchanged: 1}
    added: [policy/v1/PodDisruptionBudget/guestbook/guestbook]
    removed: [v1/ConfigMap/guestbook/guestbook-legacy]
    modified: [apps/v1/Deployment/guestbook/guestbook]
    truncated: false
  outputKeys: [diff, markdown]
  messageContains:
  - "Manifests changed: 1 added, 1 removed, 1 modified."
  - "ghcr.io/akuity/guestbook:v0.0.2"
