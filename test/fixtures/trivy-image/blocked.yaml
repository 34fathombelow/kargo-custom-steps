description: an old image with fixable CRITICAL vulnerabilities blocks the promotion and lists them
config:
  image: mirror.gcr.io/library/alpine:3.14.0
expect:
  status: Failed
  output:
    blocked: true
  outputKeys: [vulnerabilities, counts, links]
  messageContains:
  - "Promotion blocked:"
  - "CRITICAL vulnerabilities in mirror.gcr.io/library/alpine:3.14.0"
