description: a file the provenance doesn't cover (or a modified one) blocks the promotion
config:
  artifacts: [release/sbom.tar.gz, release/cli_checksums.txt]
  provenancePath: release/argocd-sbom.intoto.jsonl
  sourceUri: github.com/argoproj/argo-cd
files:
  release: test/fixtures/slsa-verify/files/argocd-v3.5.6
expect:
  status: Failed
  output:
    verified: false
  messageContains:
  - "artifact hash does not match provenance subject"
  - "the provenance doesn't cover this file, or the file was modified"
