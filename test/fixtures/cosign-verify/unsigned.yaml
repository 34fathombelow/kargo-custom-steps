description: an unsigned image (Docker Official Images are not signed with cosign) blocks the promotion
config:
  image: mirror.gcr.io/library/alpine:3.24.2
  certificateIdentityRegexp: .*
  certificateOidcIssuerRegexp: .*
expect:
  status: Failed
  output:
    verified: false
    error: no signatures found
  messageContains:
  - "no signatures found"
