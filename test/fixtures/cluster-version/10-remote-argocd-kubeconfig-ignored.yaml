description: a remote Argo CD's kubeconfig is for another cluster, so the local lookup ignores it and stays anonymous
config:
  insecureSkipTLSVerify: true
files:
  coord/kubernetes/argocd/kubeconfig: test/fixtures/cluster-version/creds/remote/kubeconfig
env:
  STEP_DIRECTORY: /workdir/coord
  KUBERNETES_SERVICE_HOST: fake-k8s-api
  KUBERNETES_SERVICE_PORT: "8443"
docker: ["--network", "runstep-k8s-api"]
expect:
  status: Failed
  output:
    source: https://fake-k8s-api:8443
  messageContains:
  - "does not allow anonymous access to /version (HTTP 401)"
