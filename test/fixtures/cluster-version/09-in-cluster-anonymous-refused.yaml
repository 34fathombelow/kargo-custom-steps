description: with no capability credentials, a cluster that refuses anonymous /version gets a message saying none were provided
config:
  insecureSkipTLSVerify: true
env:
  KUBERNETES_SERVICE_HOST: fake-k8s-api
  KUBERNETES_SERVICE_PORT: "8443"
docker: ["--network", "runstep-k8s-api"]
expect:
  status: Failed
  output:
    argocdCredentials: none
  messageContains:
  - "does not allow anonymous access to /version (HTTP 401)"
  - "the access-argocd capability provided no credentials"
