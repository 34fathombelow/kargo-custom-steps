description: >-
  when the pod's own service-account token is mounted (the step checks the standard path; CV_SA_DIR is a test hook),
  it authenticates to a cluster that refuses anonymous /version, and its ca.crt verifies TLS
config: {}
files:
  sa/token: test/fixtures/cluster-version/creds/pod-sa/token
  sa/ca.crt: .work/fake-k8s-api/tls.crt   # created by fake-api.sh
env:
  CV_SA_DIR: /workdir/sa
  KUBERNETES_SERVICE_HOST: fake-k8s-api
  KUBERNETES_SERVICE_PORT: "8443"
docker: ["--network", "runstep-k8s-api"]
expect:
  status: Succeeded
  output:
    version: v1.30.4
    auth: pod-service-account
    podServiceAccountToken: present
    argocdCredentials: none
