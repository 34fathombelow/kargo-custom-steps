description: >-
  with no apiServer, the in-cluster token + CA from the access-argocd capability authenticate to a cluster that
  refuses anonymous /version (like k3s), and TLS is verified with that CA
config: {}
files:
  coord/kubernetes/argocd/token: test/fixtures/cluster-version/creds/in-cluster/token
  coord/kubernetes/argocd/ca.crt: .work/fake-k8s-api/tls.crt   # created by fake-api.sh
env:
  STEP_DIRECTORY: /workdir/coord
  KUBERNETES_SERVICE_HOST: fake-k8s-api
  KUBERNETES_SERVICE_PORT: "8443"
docker: ["--network", "runstep-k8s-api"]
expect:
  status: Succeeded
  output:
    version: v1.30.4
    auth: argocd-capability
    source: https://fake-k8s-api:8443
