description: when anonymous /version is disabled, the step says to set a token instead of failing cryptically
config:
  apiServer: http://fake-k8s-api:8080/locked
docker: ["--network", "runstep-k8s-api"]
expect:
  status: Failed
  output:
    version: ""
  outputKeys:
  - error
  messageContains:
  - "does not allow anonymous access to /version (HTTP 401)"
  - "or set config.token"
