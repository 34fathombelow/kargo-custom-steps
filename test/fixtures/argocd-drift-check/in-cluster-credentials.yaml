description: >-
  with in-cluster credentials (token + ca.crt) the step builds a kubeconfig and queries the
  Kubernetes API; here there is no cluster, so it fails while reading the Application
config:
  app: guestbook-prod
files:
  coord: test/fixtures/argocd-drift-check/coordination
env:
  STEP_DIRECTORY: /workdir/coord
  KUBERNETES_SERVICE_HOST: 127.0.0.1
  KUBERNETES_SERVICE_PORT: "1"
expect:
  status: Failed
  messageContains:
  - "cannot read Application argocd/guestbook-prod"
