name: Release

# On a v* tag, publishes a GitHub Release with the assets `make release-assets` builds:
#   kargo-custom-steps.yaml         every custom step, for users
#   kargo-custom-steps-docs.tar.gz  every step's README, for the Kargo docs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make release-assets VERSION="${GITHUB_REF_NAME}"
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          dist/kargo-custom-steps.yaml
          dist/kargo-custom-steps-docs.tar.gz
        generate_release_notes: true
