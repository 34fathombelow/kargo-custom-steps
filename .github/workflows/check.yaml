name: Check

# lint:     repository conventions (make lint), Kargo CRD schemas (make validate), Helm chart
# test:     every step's fixtures, run by the local harness against freshly built images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: test/go.mod
        cache-dependency-path: test/go.sum
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    - run: make lint
    - run: make validate
    - run: helm lint demo-fixtures/manifest-diff/chart

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: test/go.mod
        cache-dependency-path: test/go.sum
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build step images
      run: make images
    - name: Start the fixture services (Postgres, fake Argo CD metrics)
      run: make test-services
    - name: Run step fixtures
      run: make test
