name: Images

# Builds the step images in docker/<tool>/ for linux/amd64 and linux/arm64.
#   pull_request: build changed images (no push)
#   push to main: build and push changed images, attest and sign them
#   dispatch:     rebuild one image (or all) by hand
# Tags: <version> from `ARG <TOOL>_VERSION` in the Dockerfile, plus an immutable
# <version>-<date>-<short sha>.

on:
  pull_request:
    paths: ["docker/**", "scripts/image-tag.sh", ".github/workflows/images.yaml"]
  push:
    branches: [main]
    paths: ["docker/**", "scripts/image-tag.sh", ".github/workflows/images.yaml"]
  workflow_dispatch:
    inputs:
      tool:
        description: "docker/<tool> to build, or 'all'"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.tools.outputs.tools }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - id: tools
      env:
        EVENT: ${{ github.event_name }}
        INPUT_TOOL: ${{ inputs.tool }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        all="$(ls docker)"
        case "$EVENT" in
          workflow_dispatch) if [ "$INPUT_TOOL" = "all" ]; then tools="$all"; else tools="$INPUT_TOOL"; fi ;;
          *)
            # First push of a branch (base is all zeros) or an unknown base: build everything.
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              tools="$all"
            elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(scripts/image-tag.sh|.github/workflows/images.yaml)$'; then
              tools="$all"
            else
              tools="$(git diff --name-only "$BASE_SHA" HEAD | sed -n 's#^docker/\([^/]*\)/.*#\1#p' | sort -u)"
            fi ;;
        esac
        echo "tools=$(printf '%s\n' $tools | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: meta
      run: |
        version="$(scripts/image-tag.sh '${{ matrix.tool }}')"
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.tool }}"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "tags=$image:$version,$image:$version-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - if: env.PUSH == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/${{ matrix.tool }}
        platforms: linux/amd64,linux/arm64
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        sbom: ${{ env.PUSH == 'true' }}
        provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
        cache-from: type=gha,scope=${{ matrix.tool }}
        cache-to: type=gha,mode=max,scope=${{ matrix.tool }}
    - if: env.PUSH == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - if: env.PUSH == 'true'
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE: ${{ steps.meta.outputs.image }}
      run: cosign sign --yes "$IMAGE@$DIGEST"
